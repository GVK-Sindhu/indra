services:
  - type: web
    name: indra-agentic-platform
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r apps/backend-python/requirements.txt
    startCommand: cd apps/backend-python && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: SEED_DB
        value: "true"
      - key: GEMINI_API_KEY
        sync: false
